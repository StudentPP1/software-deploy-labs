---
- name: Install MariaDB and Python MySQL driver
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
      - ufw
    state: present
    update_cache: true

- name: Start and enable MariaDB
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true

- name: Configure MariaDB bind address
  ansible.builtin.template:
    src: 50-server.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/50-server.cnf
    owner: root
    group: root
    mode: '0644'
  notify: restart mariadb

- name: Flush handlers to apply config before creating users
  ansible.builtin.meta: flush_handlers

- name: Create application database
  community.mysql.mysql_db:
    name: simple_inventory
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create application DB user (accessible from worker only)
  community.mysql.mysql_user:
    name: mywebapp
    password: root
    priv: "simple_inventory.*:ALL"
    host: "{{ worker_ip }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Flush DB privileges
  community.mysql.mysql_query:
    query: FLUSH PRIVILEGES
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Allow SSH through firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow MariaDB only from worker VM
  community.general.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    src: "{{ worker_ip }}"

- name: Deny MariaDB from all other sources
  community.general.ufw:
    rule: deny
    port: "3306"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: allow
