---
- name: Create app system user (runs the application)
  ansible.builtin.user:
    name: app
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create operator user
  ansible.builtin.user:
    name: operator
    shell: /bin/bash
    create_home: true
    state: present

- name: Set operator password
  ansible.builtin.user:
    name: operator
    password: "{{ '12345678' | password_hash('sha512') }}"
    update_password: on_create

- name: Configure operator sudo rules (limited to app service only)
  ansible.builtin.copy:
    content: |
      operator ALL=(ALL) NOPASSWD: /usr/bin/systemctl start mywebapp.service, /usr/bin/systemctl stop mywebapp.service, /usr/bin/systemctl restart mywebapp.service, /usr/bin/systemctl status mywebapp.service, /usr/bin/systemctl reload nginx
    dest: /etc/sudoers.d/operator-rules
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Download Adoptium GPG key
  ansible.builtin.get_url:
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    dest: /etc/apt/trusted.gpg.d/adoptium.asc
    mode: '0644'

- name: Add Adoptium repository
  ansible.builtin.apt_repository:
    repo: "deb https://packages.adoptium.net/artifactory/deb {{ ansible_distribution_release }} main"
    state: present
    filename: adoptium

- name: Install Temurin JDK 25
  ansible.builtin.apt:
    name: temurin-25-jdk
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: /opt/mywebapp
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: Copy application JAR to worker
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../mywebapp/build/libs/mywebapp-0.0.1-SNAPSHOT.jar"
    dest: /opt/mywebapp/mywebapp.jar
    owner: app
    group: app
    mode: '0500'
  notify: restart mywebapp

- name: Deploy mywebapp systemd service
  ansible.builtin.template:
    src: mywebapp.service.j2
    dest: /etc/systemd/system/mywebapp.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart mywebapp

- name: Enable and start mywebapp service
  ansible.builtin.systemd:
    name: mywebapp
    state: started
    enabled: true
    daemon_reload: true
