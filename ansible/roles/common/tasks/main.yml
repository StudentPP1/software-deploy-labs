---
- name: Create teacher user
  ansible.builtin.user:
    name: teacher
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    state: present

- name: Set teacher password
  ansible.builtin.user:
    name: teacher
    password: "{{ '12345678' | password_hash('sha512') }}"
    update_password: always

- name: Create /home/student directory for gradebook
  ansible.builtin.file:
    path: /home/student
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname in groups['workers']

- name: Write gradebook file
  ansible.builtin.copy:
    content: "14\n"
    dest: /home/student/gradebook
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['workers']

- name: Enable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication yes'
  notify: restart sshd

- name: Disable override SSH config that blocks password auth
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
    state: absent
  notify: restart sshd

- name: Set operator password
  ansible.builtin.user:
    name: operator
    password: "{{ '12345678' | password_hash('sha512') }}"
    update_password: always